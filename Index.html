      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .app {
      max-width: 1000px; width:100%; background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;

    .header p { opacity:0.9; margin-top:4px; }
    .main { padding: 32px; }
    .test-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
    .test-card {
      background: var(--bg); border-radius: var(--radius); padding:20px; border:1px solid var(--border);
      cursor:pointer; transition:0.2s; text-align:center;
    }
    .test-card:hover { border-color:var(--primary); transform:translateY(-2px); }
    .test-card h3 { color:var(--primary); margin-bottom:8px; }
    .section-title { font-size:1.2rem; font-weight:700; color:var(--primary); margin-bottom:16px; }
    .question-block {
      background:white; border-radius:8px; padding:12px; margin-bottom:10px;
      border-left:4px solid var(--primary); box-shadow:0 2px 6px rgba(0,0,0,0.03);
    }
    .timer { font-size:1.8rem; font-weight:700; color:var(--primary); }
    button {
      background:var(--primary); color:white; border:none; padding:10px 24px;
      border-radius:30px; font-weight:600; cursor:pointer; transition:0.2s; font-size:0.9rem;
    }
    button:hover { background:var(--primary-light); }
    button.secondary { background:white; color:var(--primary); border:2px solid var(--primary); }
    button.accent { background:var(--accent); }
    .flex { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    .hide { display:none !important; }
    textarea { width:100%; padding:12px; border-radius:8px; border:2px solid var(--border); font-family:inherit; font-size:0.95rem; resize:vertical; min-height:150px; }
    .model-answer { background:#e8f5e9; border-left:4px solid #2e7d32; padding:12px; border-radius:8px; margin-top:8px; }
    .result-card { background:var(--bg); border-radius:var(--radius); padding:20px; text-align:center; }
    .band { font-size:3rem; font-weight:800; color:var(--accent); }
    .history-item { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }

const mainEl = document.getElementById('main-container');

// Render function
function renderScreen() {
  if (currentPhase === 'select') renderTestSelection();
  else if (currentPhase === 'listening') renderListening();
  else if (currentPhase === 'reading') renderReading();
  else if (currentPhase === 'writing') renderWriting();
  else if (currentPhase === 'speaking') renderSpeaking();
  else if (currentPhase === 'results') renderResults();
}

// Test selection screen + history
function renderTestSelection() {
  let html = '<h2>Select a Mock Test</h2><div class="test-grid">';
  fullMockTests.forEach(test => {
    const completed = history.find(h => h.testId === test.id);
    html += `<div class="test-card" onclick="startTest(${test.id})">
      <h3>Mock Test ${test.id}</h3>
      ${completed ? `<p>Last score: ${completed.overall}</p>` : '<p>Not taken yet</p>'}
    </div>`;
  });
  html += '</div>';
  if (history.length > 0) {
    html += '<h3>Previous Results</h3>';
    history.reverse().forEach(h => {
      html += `<div class="history-item">
        <span><strong>Test ${h.testId}</strong> - Overall: ${h.overall}</span>
        <span>${h.date}</span>
        <button class="secondary" onclick="retakeTest(${h.testId})">Retake</button>
      </div>`;
    });
  }
  mainEl.innerHTML = html;
}

function startTest(testId) {
  currentTest = fullMockTests.find(t => t.id === testId);
  testState = { phase:'listening', listeningAnswers:{}, readingAnswers:{}, writingEssay:'', speakingTranscript:'' };
  currentPhase = 'listening';
  renderScreen();
  startTimer(30*60, 'listening', () => submitListening());
}

function retakeTest(testId) { startTest(testId); }

// Listening screen
function renderListening() {
  const test = currentTest;
  let html = `<h2>Listening Test ${test.id}</h2><p>Answer all questions. Audio plays once per part.</p>`;
  test.listening.forEach((part, pi) => {
    html += `<div class="card"><h4>Part ${pi+1}</h4><button onclick="playAudioPart(${pi})">Play Part ${pi+1}</button>`;
    part.questions.forEach((q, qi) => {
      const ansKey = `l_${pi}_${qi}`;
      if (q.type === 'text') {
        html += `<div class="question-block"><strong>${q.q}</strong><br><input type="text" id="${ansKey}" placeholder="Your answer" onchange="saveListeningAnswer('${ansKey}', this.value)"></div>`;
      } else if (q.options) {
        html += `<div class="question-block"><strong>${q.q}</strong><div class="flex">`;
        q.options.forEach((opt, oi) => {
          html += `<label><input type="radio" name="${ansKey}" value="${oi}" onchange="saveListeningAnswer('${ansKey}', '${oi}')"> ${opt}</label>`;
        });
        html += `</div></div>`;
      }
    });
    html += `</div>`;
  });
  html += `<div class="flex"><button onclick="submitListening()">Submit Listening</button><span class="timer" id="timer-display">30:00</span></div>`;
  mainEl.innerHTML = html;
}

function playAudioPart(pi) {
  const part = currentTest.listening[pi];
  let i = 0;
  function next() {
    if (i >= part.script.length) return;
    const line = part.script[i];
    speakText(line.txt, line.spk);
    i++;
    setTimeout(next, 2000);
  }
  next();
}
function speakText(text, spk) {
  const synth = window.speechSynthesis;
  const voices = synth.getVoices();
  const voice = spk === 'female' ? (voices.find(v=>v.name.includes('Female'))||voices[0]) : (voices.find(v=>v.name.includes('Male'))||voices[0]);
  const utter = new SpeechSynthesisUtterance(text);
  utter.voice = voice; utter.rate = 0.9;
  synth.speak(utter);
}
function saveListeningAnswer(key, value) { testState.listeningAnswers[key] = value; }
function submitListening() {
  // grade listening
  const test = currentTest;
  let score = 0;
  test.listening.forEach((part, pi) => {
    part.questions.forEach((q, qi) => {
      const key = `l_${pi}_${qi}`;
      const userAns = q.type === 'text' ? (document.getElementById(key)?.value||'') : document.querySelector(`input[name="${key}"]:checked`)?.value;
      if (userAns && userAns.toString().toLowerCase() === q.ans.toString().toLowerCase()) score++;
    });
  });
  testState.listeningScore = score;
  testState.listeningBand = scoreToBand(score, 40);
  currentPhase = 'reading';
  clearTimer();
  renderScreen();
  startTimer(60*60, 'reading', submitReading);
}

// Reading screen
function renderReading() {
  const test = currentTest;
  let html = `<h2>Reading Test ${test.id}</h2><div id="reading-passages">`;
  test.reading.passages.forEach((pass, pi) => {
    html += `<div class="card"><h4>${pass.title}</h4><p>${pass.text}</p></div>`;
  });
  html += `</div><h4>Questions</h4>`;
  test.reading.questions.forEach((q, qi) => {
    const key = `r_${qi}`;
    if (q.type === 'text') {
      html += `<div class="question-block"><strong>${q.q}</strong><br><input type="text" id="${key}" placeholder="Answer" onchange="saveReadingAnswer('${key}', this.value)"></div>`;
    } else if (q.type === 'TFNG') {
      html += `<div class="question-block"><strong>${q.q}</strong><div class="flex"><label><input type="radio" name="${key}" value="True" onchange="saveReadingAnswer('${key}','True')"> True</label><label><input type="radio" name="${key}" value="False" onchange="saveReadingAnswer('${key}','False')"> False</label><label><input type="radio" name="${key}" value="Not Given" onchange="saveReadingAnswer('${key}','Not Given')"> Not Given</label></div></div>`;
    } else if (q.type === 'MCQ') {
      html += `<div class="question-block"><strong>${q.q}</strong><div class="flex">`;
      q.options.forEach(opt => {
        html += `<label><input type="radio" name="${key}" value="${opt}" onchange="saveReadingAnswer('${key}','${opt}')"> ${opt}</label>`;
      });
      html += `</div></div>`;
    } else if (q.type === 'Match') {
      html += `<div class="question-block"><strong>${q.q}</strong><select id="${key}" onchange="saveReadingAnswer('${key}', this.value)"><option value="">-- Choose --</option>${q.headings.map((h,i)=>`<option value="${i}">${h}</option>`).join('')}</select></div>`;
    }
  });
  html += `<div class="flex"><button onclick="submitReading()">Submit Reading</button><span class="timer" id="timer-display">60:00</span></div>`;
  mainEl.innerHTML = html;
}
function saveReadingAnswer(key, val) { testState.readingAnswers[key] = val; }
function submitReading() {
  const test = currentTest;
  let score = 0;
  test.reading.questions.forEach((q, qi) => {
    const key = `r_${qi}`;
    let userAns = null;
    const inputEl = document.getElementById(key);
    if (q.type === 'text') userAns = inputEl?.value;
    else if (q.type === 'TFNG' || q.type === 'MCQ') userAns = document.querySelector(`input[name="${key}"]:checked`)?.value;
    else if (q.type === 'Match') userAns = inputEl?.value;
    if (userAns && userAns.toString().toLowerCase() === q.ans.toString().toLowerCase()) score++;
  });
  testState.readingScore = score;
  testState.readingBand = scoreToBand(score, 40);
  currentPhase = 'writing';
  clearTimer();
  renderScreen();
  startTimer(60*60, 'writing', submitWriting);
}

// Writing screen
function renderWriting() {
  const test = currentTest;
  let html = `<h2>Writing Test ${test.id}</h2>`;
  html += `<div class="card"><h4>Task 1</h4><p>${test.writing.task1.title}</p>`;
  if (test.writing.task1.type === 'bar') {
    html += `<svg viewBox="0 0 200 100" width="200"><rect x="20" y="60" width="30" height="40" fill="#2a5298"/></svg>`; // simplified
  }
  html += `<textarea id="writing-task1" placeholder="Write your Task 1 response..."></textarea></div>`;
  html += `<div class="card"><h4>Task 2</h4><p>${test.writing.task2.prompt}</p><textarea id="writing-task2" placeholder="Write your essay..."></textarea></div>`;
  html += `<div class="flex"><button onclick="submitWriting()">Submit Writing</button><span class="timer" id="timer-display">60:00</span><span id="word-count">Words:0</span></div>`;
  mainEl.innerHTML = html;
  document.getElementById('writing-task2').addEventListener('input', updateWordCount);
}

function submitWriting() {
  const task1 = document.getElementById('writing-task1').value;
  const task2 = document.getElementById('writing-task2').value;
  const essay = task2; // evaluate task2 only for band
  const analysis = analyzeEssay(essay);
  testState.writingBand = analysis.band;
  testState.writingEssay = essay;
  currentPhase = 'speaking';
  clearTimer();
  renderScreen();
}

// Speaking screen
function renderSpeaking() {
  const test = currentTest;
  let html = `<h2>Speaking Test ${test.id}</h2><div class="card"><h4>Part 2 Cue Card</h4><p>${test.speaking.cueCard}</p></div>`;
  html += `<div class="flex"><button id="start-prep">Start 1-min prep</button><span id="prep-timer" class="timer hide">01:00</span></div>`;
  html += `<div class="flex hide" id="rec-area"><button class="accent" id="start-rec">🔴 Record</button><button class="secondary hide" id="stop-rec">⏹ Stop</button><span id="rec-timer" class="timer hide">02:00</span></div>`;
  html += `<textarea id="transcript-display" placeholder="Your transcript..." readonly></textarea>`;
  html += `<div id="part3-area"><button onclick="showPart3()">Show Part 3 Questions</button><div id="part3-questions"></div></div>`;
  html += `<button onclick="submitSpeakingFinal()">Submit Speaking & See Result</button>`;
  mainEl.innerHTML = html;

  document.getElementById('start-prep').addEventListener('click', startPrepTimer);
}
function startPrepTimer() {
  let sec = 60;
  const timerEl = document.getElementById('prep-timer');
  timerEl.classList.remove('hide');
  document.getElementById('start-prep').classList.add('hide');
  timerEl.textContent = '01:00';
  const interval = setInterval(() => {
    sec--;
    timerEl.textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
    if (sec <= 0) { clearInterval(interval); timerEl.classList.add('hide'); document.getElementById('rec-area').classList.remove('hide'); }
  },1000);
}
function showPart3() {
  const test = currentTest;
  document.getElementById('part3-questions').innerHTML = '<ul>'+test.speaking.part3.map(q=>`<li>${q}</li>`).join('')+'</ul>';
}
function submitSpeakingFinal() {
  const transcript = document.getElementById('transcript-display').value || '';
  const wpm = transcript.split(' ').length / 2;
  let band = 6;
  if (wpm > 120) band = 7;
  else if (wpm > 90) band = 6.5;
  else band = 5.5;
  testState.speakingBand = band;
  // calculate overall
  const overall = (testState.listeningBand + testState.readingBand + testState.writingBand + testState.speakingBand) / 4;
  const overallRounded = Math.round(overall*2)/2;
  testState.overall = overallRounded;
  saveHistory();
  currentPhase = 'results';
  renderScreen();
}

// Results screen
function renderResults() {
  const {listeningBand, readingBand, writingBand, speakingBand, overall} = testState;
  let html = `<h2>Mock Test ${currentTest.id} – Result</h2>`;
  html += `<div class="result-card"><div class="band">Overall: ${overall}</div><p>Listening: ${listeningBand} | Reading: ${readingBand} | Writing: ${writingBand} | Speaking: ${speakingBand}</p></div>`;
  html += `<button onclick="backToSelection()">Back to Test Selection</button>`;
  mainEl.innerHTML = html;
  clearTimer();
}
function backToSelection() { currentPhase = 'select'; renderScreen(); }

// Helper functions
function scoreToBand(score, max) {
  const pct = score / max;
  if (pct >= 0.95) return 9;
  if (pct >= 0.85) return 8;
  if (pct >= 0.75) return 7;
  if (pct >= 0.6) return 6;
  if (pct >= 0.5) return 5.5;
  return 4.5;
}
function analyzeEssay(text) {
  const words = text.trim().split(/\s+/).filter(w=>w.length>0);
  const wc = words.length;
  let band = 6;
  if (wc >= 250) band = 6.5;
  if (wc >= 300) band = 7;
  return {band, wordCount: wc};
}
function clearTimer() { if (timerInterval) clearInterval(timerInterval); }
function startTimer(seconds, phase, callback) {
  clearTimer();
  const displayEl = document.getElementById('timer-display');
  if (!displayEl) return;
  let remaining = seconds;
  function tick() {
    const m = Math.floor(remaining/60), s = remaining%60;
    displayEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (--remaining < 0) { clearInterval(timerInterval); if (callback) callback(); }
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}
function saveHistory() {
  const entry = {
    testId: currentTest.id,
    date: new Date().toISOString().slice(0,10),
    listening: testState.listeningBand,
    reading: testState.readingBand,
    writing: testState.writingBand,
    speaking: testState.speakingBand,
    overall: testState.overall
  };
  history.push(entry);
  localStorage.setItem('ielts_mock_history', JSON.stringify(history));
}

// Speech recognition for speaking (will be added to start-rec button)
document.addEventListener('click', function(e) {
  if (e.target.id === 'start-rec') {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert('Not supported');
    const rec = new SpeechRecognition();
    rec.continuous = true;
    rec.interimResults = true;
    let finalText = '';
    rec.onresult = event => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript + ' ';
        else interim += event.results[i][0].transcript;
      }
      document.getElementById('transcript-display').value = finalText + interim;
    };
    rec.start();
    document.getElementById('start-rec').classList.add('hide');
    document.getElementById('stop-rec').classList.remove('hide');
    window.currentRecognition = rec;
  }
  if (e.target.id === 'stop-rec') {
    if (window.currentRecognition) window.currentRecognition.stop();
    document.getElementById('stop-rec').classList.add('hide');
  }
});
// Init
renderScreen();
</script>
